{% extends "base.html" %}{% block content %}
<div class="card narrow"><h2>Forgot password</h2>
<form method="post">
  <label>Enter your registered email<input type="email" name="email" required></label>
  <button class="btn">Get reset link</button>
</form>

<!-- Demo mode only: in a real system this link would be sent by email -->
{% if reset_link %}
  <p class="note">Demo mode: <a href="{{ reset_link }}">Click here to reset your password</a><br>
  <small>(Valid for 30 minutes, one use only)</small></p>
{% endif %}
<p class="muted"><a href="{{ url_for('login') }}">← Back to login</a></p></div>
{% endblock %}
