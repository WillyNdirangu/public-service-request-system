{% extends "base.html" %}{% block content %}
<div class="card narrow"><h2>Edit request #{{ r.id }}</h2>
<form method="post">
  <label>Category
    <select name="category">
      {% for c in categories %}<option {{ 'selected' if c == r.category }}>{{ c }}</option>{% endfor %}
    </select></label>
  <label>Priority
    <select name="priority">
      {% for p in priorities %}<option {{ 'selected' if p == r.priority }}>{{ p }}</option>{% endfor %}
    </select></label>
  <label>Location<input name="location" value="{{ r.location }}" required></label>
  <label>Description<textarea name="description" rows="4" required>{{ r.description }}</textarea></label>
  <button class="btn">Save changes</button>
  <a class="btn ghost" href="{{ url_for('my_requests') }}">Back</a>
</form></div>
{% endblock %}
