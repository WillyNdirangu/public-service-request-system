{% extends "base.html" %}{% block content %}
<div class="card narrow"><h2>Choose a new password</h2>
<form method="post">
  <label>New password (min 6 characters)<input type="password" name="password" minlength="6" required></label>
  <label>Confirm new password<input type="password" name="confirm" minlength="6" required></label>
  <button class="btn">Change password</button>
</form></div>
{% endblock %}
